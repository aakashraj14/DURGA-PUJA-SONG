<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Durga Puja Jukebox</title>
<style>
  :root{
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.09));
    --glass-border: rgba(255,255,255,0.38);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #3a0c28 0%, #200a1f 40%, #0c0510 75%, #050308 100%);
    overflow-x:hidden;
    color:#fff;
  }
  /* ---------- Floating particles ---------- */
  #particles{
    position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,215,150,0.9), rgba(255,215,150,0));
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    8%{ opacity:1; }
    100%{ transform: translateY(-115vh) translateX(var(--drift)); opacity:0; }
  }

  /* ---------- Header ---------- */
  .header{
    position:relative; z-index:2;
    text-align:center;
    padding: 48px 20px 160px;
  }
  .header h1{
    font-size: clamp(24px, 5vw, 40px);
    margin:0;
    font-weight:800;
    letter-spacing:0.5px;
    background: linear-gradient(90deg, #ffd98a, #ff9b6a, #ffd98a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 4px 24px rgba(255,150,80,0.25);
  }
  .header p{
    margin-top:10px;
    color: rgba(255,255,255,0.65);
    font-size:14px;
  }

  /* ---------- Social button ---------- */
  .social-btn{
    position:fixed;
    top:18px; right:18px;
    z-index:50;
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border:1px solid var(--glass-border);
    text-decoration:none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* ---------- Ad-free notice ---------- */
  .ad-notice{
    position:fixed;
    top:18px; left:50%; transform:translateX(-50%);
    z-index:60;
    max-width: 90%;
    display:flex; align-items:center; gap:10px;
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:14px;
    padding:10px 14px;
    font-size:12.5px;
    color:#fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .ad-notice button{
    background:none; border:none; color:#fff; opacity:0.7; cursor:pointer; font-size:15px; line-height:1; flex-shrink:0;
  }

  /* ---------- Player dock ---------- */
  .player-dock{
    position:fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    z-index:100;
    width: calc(100% - 32px);
    max-width: 700px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }

  .player-pill{
    flex:1;
    min-width:0;
    max-width:620px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 12px 14px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .top-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .art-wrap{
    position:relative;
    width:58px; height:58px;
    flex-shrink:0;
  }
  .vinyl{
    position:absolute;
    width:62px; height:62px;
    border-radius:50%;
    right:-18px; top:-2px;
    background:
      repeating-radial-gradient(circle at center,
        #17171a 0px, #17171a 2px,
        #2a2a2e 3px, #2a2a2e 4px);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    z-index:1;
  }
  .vinyl::after{
    content:'';
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    background: linear-gradient(135deg, #d9a24d, #b97a2e);
    top:50%; left:50%;
    transform: translate(-50%,-50%);
  }
  .vinyl.spinning{
    animation: spin 2.8s linear infinite;
  }
  @keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  .album-art{
    position:relative;
    z-index:2;
    width:58px; height:58px;
    border-radius:13px;
    object-fit:cover;
    background:#222;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }

  .track-info{
    flex:1;
    min-width:0;
  }
  .track-title{
    font-weight:700;
    font-size:14.5px;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .btn-icon{
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    opacity:0.9;
  }
  .btn-icon:active{ opacity:0.6; }
  .play-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    border:none;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }

  .bottom-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-bar{
    flex:1;
    height:5px;
    border-radius:4px;
    background: rgba(255,255,255,0.28);
    position:relative;
    cursor:pointer;
    touch-action:none;
  }
  .progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    border-radius:4px;
    background: linear-gradient(90deg, #ffd98a, #ff9b6a);
  }
  .time-display{
    font-size:11.5px;
    color: rgba(255,255,255,0.8);
    white-space:nowrap;
    flex-shrink:0;
    min-width:78px;
    text-align:right;
  }

  .shuffle-btn{
    width:48px; height:48px;
    border-radius:50%;
    flex-shrink:0;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    border: 1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    transition: background 0.2s ease;
  }
  .shuffle-btn.flash{
    background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.25));
  }

  @media (max-width: 420px){
    .track-title{ font-size:13px; }
    .time-display{ font-size:10.5px; min-width:66px; }
    .shuffle-btn{ width:42px; height:42px; }
  }

  #yt-player-container{
    position:absolute;
    width:1px; height:1px;
    top:-9999px; left:-9999px;
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="particles"></div>

<a class="social-btn" href="https://www.instagram.com/liveman.aakash" target="_blank" rel="noopener" aria-label="Instagram">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
    <rect x="3" y="3" width="18" height="18" rx="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="17.2" cy="6.8" r="1"/>
  </svg>
</a>

<div class="ad-notice" id="adNotice">
  <span>For a seamless, ad-free experience, please open this player in Brave Browser or use uBlock Origin.</span>
  <button onclick="dismissNotice()" aria-label="Dismiss">✕</button>
</div>

<div class="header">
  <h1>Durga Puja Jukebox</h1>
  <p>Tap anywhere to start the music</p>
</div>

<div id="yt-player-container"></div>

<div class="player-dock">
  <div class="player-pill">
    <div class="top-row">
      <div class="art-wrap">
        <div class="vinyl" id="vinyl"></div>
        <img class="album-art" id="albumArt" src="" alt="Album art">
      </div>
      <div class="track-info">
        <div class="track-title" id="trackTitle">Loading…</div>
      </div>
      <div class="controls">
        <button class="btn-icon" id="prevBtn" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M6 6h2v12H6zM19.5 6.3v11.4L9 12z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" aria-label="Play/Pause">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-icon" id="nextBtn" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M16 6h2v12h-2zM4.5 6.3v11.4L15 12z"/></svg>
        </button>
      </div>
    </div>
    <div class="bottom-row">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
    </div>
  </div>

  <div class="shuffle-btn" id="shuffleBtn" aria-label="Shuffle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 3 21 3 21 8"></polyline>
      <line x1="4" y1="20" x2="21" y2="3"></line>
      <polyline points="21 16 21 21 16 21"></polyline>
      <line x1="15" y1="15" x2="21" y2="21"></line>
      <line x1="4" y1="4" x2="9" y2="9"></line>
    </svg>
  </div>
</div>

<script>
  /* ================= Particles ================= */
  (function createParticles(){
    const container = document.getElementById('particles');
    const count = window.innerWidth < 600 ? 22 : 38;
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random()*4 + 2;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = Math.random()*100 + '%';
      const duration = Math.random()*12 + 14;
      p.style.animationDuration = duration+'s';
      p.style.animationDelay = (Math.random()*duration)+'s';
      p.style.setProperty('--drift', (Math.random()*70 - 35)+'px');
      p.style.opacity = (Math.random()*0.4 + 0.15).toFixed(2);
      container.appendChild(p);
    }
  })();

  /* ================= Ad notice ================= */
  if(localStorage.getItem('dpj_notice_dismissed')){
    document.getElementById('adNotice').style.display = 'none';
  }
  function dismissNotice(){
    document.getElementById('adNotice').style.display = 'none';
    localStorage.setItem('dpj_notice_dismissed', '1');
  }

  /* ================= YouTube Player ================= */
  const PLAYLIST_ID = 'PLSsyxfDiLI4nUTBZBBjyIVP60JLv5-ux9';
  let player;
  let isPlaying = false;
  let progressTimer;

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('yt-player-container', {
      height: '1',
      width: '1',
      playerVars:{
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 1,
        mute: 1,
        controls: 0,
        playsinline: 1,
        rel: 0,
        modestbranding: 1
      },
      events:{
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange
      }
    });
  };

  function onPlayerReady(e){
    try{
      e.target.mute();
      e.target.playVideo();
    }catch(err){}
    startProgressLoop();
    setTimeout(updateTrackInfo, 400);
  }

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      document.getElementById('vinyl').classList.add('spinning');
      document.getElementById('playIcon').innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
      updateTrackInfo();
    } else if(e.data === YT.PlayerState.PAUSED){
      isPlaying = false;
      document.getElementById('vinyl').classList.remove('spinning');
      document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else if(e.data === YT.PlayerState.ENDED){
      player.nextVideo();
    } else if(e.data === YT.PlayerState.CUED){
      updateTrackInfo();
    }
  }

  function updateTrackInfo(){
    try{
      const data = player.getVideoData();
      if(data && data.title){
        document.getElementById('trackTitle').textContent = data.title;
      }
      if(data && data.video_id){
        document.getElementById('albumArt').src = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
      }
    }catch(err){}
  }

  function formatTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const m = Math.floor(s/60);
    const sec = String(s%60).padStart(2,'0');
    return m + ':' + sec;
  }

  function startProgressLoop(){
    progressTimer = setInterval(function(){
      if(!player || typeof player.getDuration !== 'function') return;
      let dur, cur;
      try{
        dur = player.getDuration();
        cur = player.getCurrentTime();
      }catch(err){ return; }
      if(dur > 0){
        document.getElementById('progressFill').style.width = (cur/dur*100) + '%';
        document.getElementById('timeDisplay').textContent = formatTime(cur) + ' / ' + formatTime(dur);
      }
    }, 500);
  }

  /* ================= Controls ================= */
  document.getElementById('prevBtn').addEventListener('click', function(){
    try{ player.previousVideo(); }catch(err){}
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    try{ player.nextVideo(); }catch(err){}
  });
  document.getElementById('playBtn').addEventListener('click', function(){
    try{
      if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
    }catch(err){}
  });

  document.getElementById('progressBar').addEventListener('click', function(e){
    try{
      const rect = this.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const dur = player.getDuration();
      if(dur > 0){ player.seekTo(dur * pct, true); }
    }catch(err){}
  });

  document.getElementById('shuffleBtn').addEventListener('click', function(){
    const btn = this;
    btn.classList.add('flash');
    setTimeout(function(){ btn.classList.remove('flash'); }, 300);
    try{
      const list = player.getPlaylist();
      const currentIndex = player.getPlaylistIndex();
      if(!list || list.length < 2) return;
      let idx;
      do{
        idx = Math.floor(Math.random() * list.length);
      } while(idx === currentIndex);
      player.playVideoAt(idx);
    }catch(err){}
  });

  /* ================= First-interaction unmute ================= */
  let unmuted = false;
  function unmuteOnFirstInteraction(){
    if(unmuted) return;
    unmuted = true;
    try{
      player.unMute();
      player.setVolume(100);
    }catch(err){}
    document.removeEventListener('click', unmuteOnFirstInteraction);
    document.removeEventListener('touchstart', unmuteOnFirstInteraction);
  }
  document.addEventListener('click', unmuteOnFirstInteraction);
  document.addEventListener('touchstart', unmuteOnFirstInteraction);
</script>

</body>
</html>
